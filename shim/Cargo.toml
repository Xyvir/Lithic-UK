[package]
name = "lithic-shim"
version = "0.1.0"
description = "Serves the Lithic launcher and wiki engine to the browser already on the machine"
authors = ["you"]
edition = "2021"

# No toolkit, and that is the whole point of this crate. `src-tauri` links GTK and
# WebKitGTK through Tauri, which is why its AppImage is an 82 MB download: the engine
# travels with the app. This binary carries none of that, so the artifact stays the
# size of the payload it serves rather than the size of an engine (see the release round in
# docs/rounds/).
#
# Two dependencies, and each one is here because the alternative was worse than the
# crate. `getrandom` is the operating system's entropy source, which a per-launch
# secret cannot be hand-rolled from: the standard library has no CSPRNG, and a token
# built from the clock and the process id is guessable by exactly the kind of page
# it exists to keep out. `serde_json` is the command wire, in both directions: the
# launcher asks with a JSON object and parses a JSON answer, and a hand-written
# reader for a format with escapes and nesting is a liability rather than a saving.
# Neither links anything, so the binary still needs no toolkit to start.
#
# The git sync is the one thing that needs more than the standard library, and the set is
# chosen for size first because that is the crate's whole proposition. The reads
# (`shim/src/git.rs`) need nothing: a repository Lithic manages is marked by an origin URL in
# `.git/config`, which is text. Everything else, the device flow (`shim/src/github.rs`) and
# next the writes, needs TLS, and the decision recorded in the round log (`docs/rounds/`) is that
# the TLS is the system's rather than ours. `libssl` is already on any Linux that has `ssh` or a package
# manager, so a dynamically linked one costs this artifact nothing, where a vendored one would
# be a second copy of a library the machine is already patching.
#
# `git` itself is the opposite call and stays packaged in. `vendored-libgit2` compiles
# libgit2's C sources (with its bundled llhttp, xdiff and PCRE2) and links them statically, so
# the shim carries its own git rather than shelling out to whatever `git` the machine happens
# to have: a program whose version and configuration the launcher cannot control, and whose
# absence would be one more thing a person has to install.
#
# What that asks of the two builds. Linux needs `libssl-dev` at build time and `libssl` at run
# time, and the release job installs the headers for exactly this reason (see
# `.github/workflows/desktop-release.yaml`); the shim is built on `ubuntu-22.04`, so the linked
# ABI is OpenSSL 3.0, which is the lowest any current distribution ships. Windows and macOS
# are untouched: `git2`'s `https` means WinHTTP and SecureTransport there, `openssl-sys` is not
# a dependency of this crate at all on Windows, and `native-tls` is SChannel and Security, so a
# Windows checkout needs no OpenSSL to compile or run any of this.
[dependencies]
getrandom = "0.2"
serde_json = "1"
# The GitHub device flow and REST calls (`shim/src/github.rs`). Blocking on purpose: the shim
# is one thread per connection, so there is no reactor to feed and no async runtime to pay
# for. `default-features = false` drops ureq's own rustls default:
# the TLS here is `native-tls`, which is the platform stack (OpenSSL on Linux, SChannel on
# Windows, Security on macOS), and rustls beside it would be a second implementation of a
# thing the machine already has. `vendored` is deliberately not asked for, for the same reason
# the manifest does not ask `git2` for `vendored-openssl` above.
#
# **Dropping the feature is not what selects the provider, and this line was once read as if it
# were.** ureq's `TlsProvider` defaults to Rustls whatever the features say, and its own
# documentation calls the `native-tls` setting one that "is never picked up automatically"; a
# request to an https URI then panics in the transport ("uri scheme is https, provider is
# Rustls but feature is not enabled: rustls") rather than failing. Since the release profile is
# `panic = "abort"`, that panic ended the shim process, and the launcher's fetch (a fetch to
# *this same server*) answered nothing, which is the `unreachable` the dialog showed. The
# provider and the trust store are both named explicitly in `agent()`; ureq 3.4.2, measured
# against the released `Lithic_10.01.26-2129.AppImage`.
#
# Known and measured, not overlooked: ureq's stable `native-tls` feature also pulls
# `webpki-root-certs`, a bundled copy of the Mozilla root program. The path this uses does not
# read it, but only because `agent()` names `RootCerts::PlatformVerifier`: that feature also
# makes `RootCerts::WebPki` *available*, and WebPki is the default, so a default agent on the
# native path calls `disable_built_in_roots(true)` and verifies against the bundled set rather
# than the machine's trust store. ureq's `native-tls-no-default` is the feature that drops the
# blob outright, and it is on ureq's unstable list, so it is not worth a build this repository
# depends on for a data blob the linker may drop anyway. Worth one word the day it leaves that
# list.
ureq = { version = "3", default-features = false, features = ["native-tls"] }
# The writes (`git-setup`, `git-commit`, `git-heartbeat`, `git-reauth`, `git-disconnect`) are
# why this is here. `https` is what gives libgit2 a transport at all: on Linux that pulls
# `openssl-sys`, which links the system `libssl`; the platform stacks need no crate. And
# `vendored-libgit2` is the call that keeps git ours, compiling libgit2's C and linking it
# statically rather than looking for a system `libgit2` that may be absent or the wrong version.
git2 = { version = "0.21", default-features = false, features = ["https", "vendored-libgit2"] }

[profile.release]
# The AppImage is the payload plus this binary, so the binary is worth shrinking:
# most of its bytes would otherwise be unused formatting and symbol tables.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
