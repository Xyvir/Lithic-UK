[env:esp32dev]
# Pinned because the images it builds are published as a download and, from there,
# written into somebody's board: a platform that moved under the same tag would make
# two appliances from one commit. Raise it deliberately.
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200

board_build.partitions = partitions.csv
board_build.filesystem = littlefs

lib_deps =
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    https://github.com/ESP32Async/AsyncTCP.git

extra_scripts = pre:scripts/download_assets.py