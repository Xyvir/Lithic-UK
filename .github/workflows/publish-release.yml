name: Publish Release

# The second half of a release.
#
# build-wiki.yml builds, stages the result on a branch and opens a pull request. This
# workflow runs when that pull request is MERGED, and only then does a build get a tag, a
# download page, a container image, four desktop installers and one Android APK. Closing
# the pull request instead leaves none of that behind: there is no draft release and no
# tag to clean up, because neither was ever made. That is the whole point of splitting the
# release in two, and it is why the cleanup path is nothing at all rather than a step that
# deletes things.
#
# THE TRIGGER PATHS ARE A SUPERSET OF THE PUSHES THAT ARE RELEASES, and the gate job below
# narrows it back down. Path triggers cannot see why a file changed, and a release does not
# touch one fixed set of files:
#
#   * the wiki bytes differ only when a wiki source changed, and the launcher bytes only when
#     launcher-ui/ did. A release that changes nothing but the app's Rust half (`src-tauri/`,
#     `shim/`) rebuilds BOTH to the same bytes, so its merge would carry no artifact at all.
#     Measured on 2026-10-10: the two release pull requests of that day (build-2026.10.10-1830
#     and -1858) each changed `manifest.json`, `offline-service-worker.js` and
#     `src/launcher.html` and nothing else, and the merged one published no tag, no release, no
#     desktop downloads and no APK. Nothing said so; the pull request read as merged either way.
#   * what a release ALWAYS writes is the PWA version bump, in `manifest.json` and
#     `offline-service-worker.js`, which is why those two are the paths that cannot go missing.
#
# The cost of leaning on the bump is that bump-pwa-version.yml writes the same two files to main
# without a release behind them, and that push must publish nothing. Hence the gate: a push
# publishes when the commits it landed contain a release commit, or when it touched an artifact
# the release writes (a human pushing src/lithic.html by hand, which is right for the same
# reason), and stays quiet otherwise. The tag is taken from the release commit's own subject, so
# the release somebody reviewed is the release that is tagged, whatever minute the merge landed.
on:
  push:
    branches:
      - main
    paths:
      - 'src/lithic.html'
      - 'src/launcher.html'
      - 'manifest.json'
      - 'offline-service-worker.js'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to publish, e.g. build-2026.10.09-1200'
        required: true
        type: string

permissions:
  contents: write
  packages: write

# Two merges can be minutes apart and each publishes a tag, so they are serialized the way
# two writers to main are. The group is its own rather than `main-writers`, because this
# workflow writes no commit: it adds a tag, a release and container images.
concurrency:
  group: release-publishers
  cancel-in-progress: false

jobs:
  # Is this push a release at all? The paths above are a superset, and this is the part that
  # reads the commit rather than its file list. It runs on every event and answers for a
  # dispatch too, rather than being skipped there, so `publish` depends on a job that always
  # succeeds and never has to reason about a skipped dependency.
  gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      stamp: ${{ steps.decide.outputs.stamp }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Decide whether this push is a release
        id: decide
        run: |
          if [ '${{ github.event_name }}' != 'push' ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "A dispatch names the tag it wants, so it publishes."
            exit 0
          fi
          # The push's own commits: a merge commit's subject says "Merge pull request #6", so
          # reading HEAD's subject alone would miss every release. The release commit is the
          # branch tip that was merged, and it is in this range. A range GitHub cannot resolve
          # (a branch creation, where it sends all zeroes) falls back to the tip's own subject
          # and never to a wider range: five commits of history would find the PREVIOUS release
          # commit and publish it a second time. The file half below falls back the same way, to
          # the tip's own change set, which decides on that push and lands on a dated tag.
          SUBJECTS=$(git log --format=%s "${{ github.event.before }}..HEAD" 2>/dev/null) \
            || SUBJECTS=$(git log --format=%s -n 1)
          # `|| true` because the runner's shell is `bash -eo pipefail`: `head` closing the pipe
          # early can surface as a 141 from `sed`, and a step that fails on its own success
          # would publish nothing at all.
          STAMP=$(printf '%s\n' "$SUBJECTS" | sed -n 's/^Release build-\([0-9][0-9.]*-[0-9][0-9]*\):.*$/\1/p' | head -n 1 || true)
          if [ -n "$STAMP" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
            echo "Publishing the release commit's own stamp, build-$STAMP"
            exit 0
          fi
          # No release commit here: a hand-push of an artifact still publishes, because those
          # paths are written by the release and by nothing else.
          CHANGED=$(git diff --name-only "${{ github.event.before }}" HEAD 2>/dev/null \
            || git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          if printf '%s\n' "$CHANGED" | grep -qxE 'src/(lithic|launcher)\.html'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "A release artifact was pushed by hand"
            exit 0
          fi
          # The version bump pushed by hand. It names the same two files a release does and has
          # no wiki, launcher, installer or APK behind it, so it publishes nothing.
          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Not a release commit and no release artifact changed, so nothing publishes."

  publish:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.stamp.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve the tag
        id: stamp
        run: |
          STAMP="${{ inputs.tag_name }}"
          if [ -n "$STAMP" ]; then
            # A dispatch names the tag it wants; accept it with or without the prefix.
            STAMP="${STAMP#build-}"
          elif [ -n "${{ needs.gate.outputs.stamp }}" ]; then
            # The stamp the release commit carries, so the tag names the build that was
            # reviewed rather than the minute the merge happened to land.
            STAMP="${{ needs.gate.outputs.stamp }}"
          else
            STAMP=$(date +'%Y.%m.%d-%H%M')
          fi
          echo "date=$STAMP" >> "$GITHUB_OUTPUT"
          echo "tag=build-$STAMP" >> "$GITHUB_OUTPUT"
          echo "Publishing build-$STAMP"

      # Four of the six assets are files the merge just landed, and they are published as
      # they are: src/lithic.html, src/launcher.html and variants/lithic-light.html came
      # through the review, so the download is exactly the bytes that were looked at. The
      # other two are derived rather than committed and are rebuilt here from that same
      # tree, which is the only reason this job installs anything.
      - name: Check the released files are there
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -f src/lithic.html ] || fail "src/lithic.html is missing from the merge; this is not a release commit"
          [ -f src/launcher.html ] || fail "src/launcher.html is missing from the merge"
          [ -f variants/lithic-light.html ] || fail "variants/lithic-light.html is missing from the merge"
          ls -la src/lithic.html src/launcher.html variants/lithic-light.html

      - name: Install Dependencies
        run: npm ci

      - name: Mirror External Plugins
        run: npm run mirror

      - name: Flatten Plugins
        run: node scripts/flatten-plugins.js

      - name: Gzip the light artifact
        run: |
          gzip -9 -c variants/lithic-light.html > variants/lithic-light.html.gz
          ls -la variants/lithic-light.html.gz
          # The flash budget the light build exists to meet, restated here because this is
          # now the last place it can be checked before somebody downloads it.
          GZ=$(stat -c%s variants/lithic-light.html.gz)
          [ "$GZ" -lt 1048576 ] || { echo "::error::the light artifact gzips to $GZ bytes, over the 1 MB budget"; exit 1; }

      - name: Archive Wiki Folder
        run: zip -r wiki.zip wiki

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.stamp.outputs.tag }}
          name: Build ${{ steps.stamp.outputs.date }}
          draft: false
          prerelease: false
          # One asset per artifact. The flagship used to be attached twice, as
          # wiki/output/lith.html and as the identical copy committed to
          # variants/prod.html, which reads as two releases of the same file.
          # src/lithic.html is those same bytes and already carries the name the release
          # publishes, so the download matches the file the desktop app embeds.
          files: |
            src/lithic.html
            src/launcher.html
            variants/lithic-light.html
            variants/lithic-light.html.gz
            wiki.zip
            wiki/flatten-manifest.log

  # The four desktop distributions, chained once the release exists so the installers are
  # added to a download page that is already there. Each of these downloads the
  # `built-wiki` artifact when one is present in the run and falls back to the committed
  # src/lithic.html when it is not, which is the case here: the bytes came through the
  # merge, so the checkout is the artifact.
  build-desktop:
    needs: publish
    uses: ./.github/workflows/desktop-release.yaml
    with:
      tag_name: ${{ needs.publish.outputs.tag_name }}
    secrets: inherit

  # The phone build, chained the same way and for the same reason: an APK added to a
  # download page that already exists. It is a workflow of its own rather than a fifth job
  # in the desktop one (see the header of `android-release.yml` for why), and like every
  # job in this chain it only ever adds a file to the release.
  build-android:
    needs: publish
    uses: ./.github/workflows/android-release.yml
    with:
      tag_name: ${{ needs.publish.outputs.tag_name }}
    secrets: inherit

  build-server:
    needs: publish
    uses: ./.github/workflows/build-server.yml
    with:
      tag_name: ${{ needs.publish.outputs.tag_name }}
    secrets: inherit
