name: Android Manual Release

# The phone build: one signed, universal APK, added to the same release the wiki
# artifacts and the four desktop installers land on. Chained from publish-release.yml
# once the release exists, so a build's download page carries every platform a Lithic
# can be installed on.
#
# THE LAUNCHER IS NOT BUILT HERE. The Svelte launcher (`launcher-ui/`) is built once per
# release, by `build-wiki.yml`, and committed to `src/launcher.html`, which is the copy this
# checkout carries and the copy `tauri.conf.json` embeds as its `src/` frontend. A build
# here would be the same build again, and it could only make the launcher inside this APK
# differ from the `launcher.html` published beside it on the release page. The launcher's
# own unit tests run in `build-wiki.yml`, in the same job as the build they guard.
# A dispatch from a tree that carries no `src/launcher.html` builds one rather than
# stranding the job; a dispatch from a branch whose `launcher-ui/` changed without a
# `build-wiki.yml` run packages that branch's committed launcher.
#
# WHY THIS IS A WORKFLOW OF ITS OWN rather than a fifth job beside the four in
# `desktop-release.yaml`: those four are one subject (a machine that installs by putting a
# file somewhere) and this is another (a package a store or a phone's own installer
# places). The two also disagree about every tool they need. Keeping them apart means
# "Desktop Manual Release" keeps meaning that, and it means this job can be dispatched on
# its own while the platform is being brought up, which is the state it is in.
#
# WHAT SIGNS IT, AND WHY THE KEY IS A SECRET RATHER THAN A FILE HERE. Android refuses an
# unsigned package and refuses one whose signature does not match the installed copy, so an
# updater is only as good as a key that stays the same from release to release. Every build
# before this one was signed with a debug key the runner invented on that run: measured on
# the published APK, the v2 certificate read `CN=Android Debug` with a `notBefore` ten
# seconds before its own upload, so each release was uninstallable over the last one. The
# key is now a keystore generated once for this project (RSA 4096, PKCS12, valid until
# 2054) and kept in four repository secrets: the keystore base64, its store password, the
# alias and the key password. Nothing in the tree holds it, and `scripts/patch-android.mjs`
# writes the copy and the `keystore.properties` Gradle reads into the generated project,
# because `tauri android init` rewrites that tree on every run. A release build (the default) is what makes
# Gradle use it; a local run names no key, leaves the template alone, and still builds a
# debug APK. The break this makes is one release wide and deliberate: a phone holding a
# previously published debug build has to uninstall it once to adopt a signed one, which is
# cheaper now than after a store is listing it.
#
# WHAT VERSION THE APK CARRIES, and a fault this fixed rather than restated. `tauri android
# build` writes `app/tauri.properties` from the CLI's merged config, and the CLI only ever
# SETS `TAURI_CONFIG` (for the Rust build) and never reads it, so the `TAURI_CONFIG` line
# this file used to carry never reached the APK at all: the published build carried
# `versionName=0.2.0` and `versionCode=2000` from `tauri.conf.json`, read out of its
# manifest, while the release page named a stamp. The version now goes in through
# `--config`, which the CLI does merge: versionName is the release stamp's date and
# versionCode is minutes since the epoch, so every build orders after the one before it,
# which is the single property an updater needs. `LITHIC_BUILD_TAG` is still a separate
# thing and is still what the launcher compares against the newest release.
#
# WHICH PHONES IT OPENS ON, and why two architectures rather than the four the template
# assumes. The APK is gradle's `universal` flavor, which packages every ABI it is handed:
# arm64-v8a and armeabi-v7a for phones, and x86 with x86_64 for the emulator, which is what
# an emulator runs and no phone sold this decade does. Measured on the one published APK
# (`Lithic_10.10.26-1817_debug.apk`, 632,262,452 bytes, named before the key change) by
# reading its zip directory rather than downloading it: 595.4 MB of the 603 MB is four
# `lib/<abi>/libapp_lib.so` files, each
# stored uncompressed (155.5 MB arm64-v8a, 156.8 MB x86_64, 146.1 MB x86, 137.1 MB
# armeabi-v7a), and everything else together (eight `classes*.dex`, `resources.arsc`, 884
# `res/` entries, `META-INF` and one `assets/tauri.conf.json`) is 7.3 MB, with the last
# ~0.2 MB the zip directory and the signing block. So the emulator pair was 302.9 MB of a
# download that no phone has ever installed. `--target aarch64 armv7` is what leaves it out:
# cargo-mobile2 turns that into `assembleUniversalRelease -PabiList=arm64-v8a,armeabi-v7a
# -ParchList=arm64,armv7 -PtargetList=aarch64,armv7`, and the verification step below fails
# the run if an `x86` slice comes back, so the saving is a fact about the artifact rather
# than an intention. What it costs is named rather than hidden: an emulator cannot install
# this APK, and the day one is wanted the flag loses its x86 half rather than the build
# growing a second flavor.
#
# WHY IT IS A RELEASE BUILD AND NOT A TUNED DEBUG ONE. The debug profile used to be tuned
# from here (`CARGO_PROFILE_DEV_DEBUG=0`, `opt-level=s`, `strip=symbols`) because `--debug`
# was the only path to an installable file. Release builds need none of that: `Cargo.toml`'s
# release profile already asks for LTO and a strip, and the debug tune is gone rather than
# left in place unread.
#
# WHY THE GRADLE PROJECT IS NOT IN THE REPOSITORY: `tauri android init` writes
# `src-tauri/gen/android/`, and `src-tauri/gen/` is gitignored because everything in it is
# derived from `tauri.conf.json` and `capabilities/`, both of which are tracked. Running
# init here rather than committing its output keeps that rule whole and keeps the build
# reproducible from the sources. The cost is one init per run (seconds), and the follow-up
# if anyone wants Android Studio on the project is to commit the generated tree and
# delete this step.
#
# It only ever ADDS a file, like every other job in this chain, so it cannot blank another
# platform's work. Where the chain gives it a tag that release already exists; a tag-less
# hand-run stamps its own instead (see below), which contains nothing but this artifact.
#
# A HAND-RUN MAY NAME THE RELEASE IT ADDS TO, OR MINT ONE OF ITS OWN, and the tag input is the
# whole of the difference. Given a tag, this job adds the APK to that release: what the chain
# does, and what fills in an APK that is missing from a release built earlier. Given none, the
# stamp step below makes one from the clock and the release action creates that release holding
# this artifact alone, which is the behaviour the desktop workflow's dispatch has. A tag-less run
# therefore mints a new release rather than adding to an existing one, and that is a trade named
# rather than hidden: the chain never does it (`publish-release.yml` always passes the tag it
# has just created), so the rule in the paragraph above still holds for every released build,
# while a hand-run no longer has to find a release before it can build at all.
on:
  workflow_dispatch:
    inputs:
      # Optional, and empty means the stamp step below makes one from the clock, exactly as the
      # desktop workflow's dispatch does. A hand-run with no tag builds a release of its own
      # holding only the APK rather than adding to one, which is what bringing the platform up
      # needs: a run should not have to find or name a release before it can build.
      tag_name:
        description: 'Release tag to add the APK to. Leave empty to stamp a new one.'
        required: false
        type: string
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string

permissions:
  contents: write

# No job here drives a browser, so puppeteer's install step is told not to fetch Chrome: the
# launcher is built once elsewhere and this job embeds the committed bytes. See
# `.github/actions/setup` for the rest of what is shared.
env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout and set up Node
        uses: $/.github/actions/setup

      # NO WIKI ARTIFACT IS DOWNLOADED HERE, for the reason desktop-release.yaml spells out
      # at its own first job: the `built-wiki` artifact belongs to the build run, this job
      # runs in the publish-release run, and the APK embeds the committed src/lithic.html,
      # which is that artifact's own bytes because the merged pull request carried them.

      # Gradle runs on a JVM and the Android Gradle plugin is fussy about which. 17 is what
      # Tauri's own Android template targets, and pinning it here is the same decision as
      # pinning the Linux jobs to 22.04: the toolchain that produces a release should not
      # change because a runner image was rolled forward.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The two phone ABIs, named rather than left to `android build` to install for itself: a
      # target that is not installed is a build that fails rather than a download that quietly
      # carries fewer architectures than its name claims. The x86 pair is not here on purpose,
      # and the header has the measurement behind that choice.
      - name: Set up Rust
        uses: $/.github/actions/rust
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      # The SDK is on the runner image; the NDK is what has to be found rather than
      # assumed. Both variables are exported because they answer different questions:
      # `ANDROID_HOME` is where the SDK is, which Gradle reads, and `NDK_HOME` is which
      # toolchain Tauri's CLI hands cargo, which is the cross-linker and the C compiler that
      # `rustls`' ring and the JNI glue are built with. A runner image that carries no NDK
      # gets the pinned one installed here, so this step cannot be the thing that makes the
      # job fail on a future image.
      - name: Set up the Android SDK and NDK
        run: |
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$sdk" ]; then
            echo "::error::no Android SDK at $sdk. This job needs a runner image that carries one."
            exit 1
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          ndk="$(ls -1 "$sdk/ndk" 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$ndk" ]; then
            echo "No NDK on the image; installing the pinned one."
            yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" > /dev/null
            ndk="27.0.12077973"
          fi
          if [ ! -d "$sdk/ndk/$ndk" ]; then
            echo "::error::$sdk/ndk/$ndk is not there after setup."
            exit 1
          fi
          echo "NDK_HOME=$sdk/ndk/$ndk" >> "$GITHUB_ENV"
          echo "Using NDK $ndk"

      - name: Install Dependencies
        run: npm ci

      # NO LAUNCHER BUILD HERE. The Svelte launcher is built once per release, in
      # build-wiki.yml, and committed to src/launcher.html, which is the copy this workflow's
      # checkout carries and the copy tauri.conf.json embeds as `src/`. Rebuilding it per
      # platform is the same build again, and it could only make the phone's launcher differ
      # from the launcher.html published on the release page beside this APK. The guarded step
      # below is for a hand-dispatch from a tree that carries none.
      - name: Build Launcher (only if the checkout carries none)
        if: ${{ hashFiles('src/launcher.html') == '' }}
        run: npm run build:launcher

      # THIS JOB STILL GENERATES THE ICON SET, and since 2026-10-16 it is the only one that
      # does. The desktop jobs stopped when regenerating was measured against what is committed
      # and found to be the same drawing every time (all sixteen files pixel-identical, only the
      # encoder's bytes smaller), so four regenerations of one drawing per release were buying
      # nothing. What this job cannot borrow is the part it needs: `scripts/patch-android.mjs`
      # copies `src-tauri/icons/android/**`, which no commit carries, so the set has to be
      # produced here or the APK keeps the template's icon. This has to run before the patch
      # step below, which is what actually puts the set into the Gradle project: `android init`
      # does NOT copy `src-tauri/icons/android/`, whatever an earlier version of this comment
      # claimed. Measured on the installed APK: the icon resources were the template's, so the
      # launcher icon was generic.
      - name: Generate Icons
        run: |
          if [ -f src/app-icon.png ]; then
            npm run tauri icon src/app-icon.json
          else
            echo "Icon file 'src/app-icon.png' not found, skipping icon generation."
          fi

      - name: Generate Date-Based Tag
        id: tag
        run: |
          tag="${{ inputs.tag_name }}"
          if [ -z "$tag" ]; then
            tag="v$(date +'%Y.%m.%d-%H%M')"
          fi
          echo "date=$tag" >> "$GITHUB_OUTPUT"
          # The same stamp rule as the exe and the four downloads beside it
          # (MM.DD.YY-HHMM), so one release's files still read as one set rather than as a
          # fifth naming scheme. The `_debug` suffix is gone with the debug key: the name now
          # states the platform rather than the key, and every APK installs over the last one.
          # Anything unparseable falls back to the whole tag, so a build never fails here.
          if [[ "$tag" =~ ([0-9]{4})\.([0-9]{2})\.([0-9]{2})-([0-9]{4}) ]]; then
            apk="Lithic_${BASH_REMATCH[2]}.${BASH_REMATCH[3]}.${BASH_REMATCH[1]:2:2}-${BASH_REMATCH[4]}.apk"
          else
            apk="Lithic_${tag}.apk"
          fi
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          # The versionName, with leading zeros stripped because Android rejects one that has
          # them, and the versionCode, which is minutes since the epoch: monotonic across builds
          # however the tag is spelled, and far inside Android's 2,100,000,000 ceiling. Both are
          # handed to the build command as `--config`, which the CLI merges into the config it
          # writes `tauri.properties` from. `TAURI_CONFIG` is what the CLI *sets* for the Rust
          # build and never reads, which is why the line this step used to emit never reached the
          # APK: the published builds carried versionName 0.2.0 and versionCode 2000.
          if [[ "$tag" =~ ([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            ver="${BASH_REMATCH[1]}.$((10#${BASH_REMATCH[2]})).$((10#${BASH_REMATCH[3]}))"
          else
            ver="0.2.0"
          fi
          code=$(( $(date -u +%s) / 60 ))
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "android_config={\"version\":\"$ver\",\"bundle\":{\"android\":{\"versionCode\":$code}}}" >> "$GITHUB_OUTPUT"

      # Generated here rather than committed (see the header). `--ci` is what stops it asking
      # whether to overwrite anything.
      - name: Initialize the Android Project
        run: npm run tauri android init -- --ci

      # The key, decoded from the secret that carries it. It goes to the runner's temp directory
      # rather than into the checkout; the patch step below copies it into the generated project,
      # which is gitignored and dies with the runner. A missing secret fails here rather than
      # producing an unsigned APK that Android refuses to install.
      - name: Write the Signing Key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set, so there is no key to sign a release with."
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lithic-release.jks"
          if [ ! -s "$RUNNER_TEMP/lithic-release.jks" ]; then
            echo "::error::the keystore secret decoded to nothing."
            exit 1
          fi

      # The project init has just written is Tauri's template, and this is where the things wrong
      # with it are put right: the placeholder launcher icon, an activity that draws the page
      # under the system bars, the missing hand-off filter, and the release signing config the
      # template does not carry. The order is the point rather than a detail: init rewrites that
      # tree on every run, so the patch has to come after it and before the build.
      # `scripts/patch-android.mjs` verifies each thing it wrote and exits non-zero with a
      # specific message when it cannot, because the failure mode here is an APK that installs
      # and simply looks wrong.
      - name: Patch the Generated Android Project
        env:
          LITHIC_ANDROID_KEYSTORE: ${{ runner.temp }}/lithic-release.jks
          LITHIC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LITHIC_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LITHIC_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/patch-android.mjs

      # Release build type (default) and not `--debug`: the release build type is the one the patch gave the
      # keystore to, and the release Rust profile `Cargo.toml` already asks for (LTO and a strip)
      # is both smaller and faster than the debug profile this job used to tune from its own
      # environment. `--apk` and not `--aab`: an AAB is a Play upload, not something a person can
      # install, and there is no Play listing to upload to yet. No `--split-per-abi` either,
      # because one download that opens on whichever phone fetched it is the whole point of a
      # universal build; that flag is for the day the size matters more than the confusion.
      # `--target aarch64 armv7` is the other half of that choice: the universal flavor packages
      # every ABI it is handed, and handing it the two phone architectures is what keeps the
      # emulator pair out of a phone's download (see the header for the numbers).
      #
      # `--config` is how the version reaches `tauri.properties`; see the tag step for why the
      # `TAURI_CONFIG` environment variable never did.
      - name: Build the APK
        env:
          # Baked in for the same reason the desktop jobs bake it: the launcher compares it
          # against the newest release and offers the download page when they differ. A build
          # without it offers nothing.
          LITHIC_BUILD_TAG: ${{ steps.tag.outputs.date }}
          ANDROID_CONFIG: ${{ steps.tag.outputs.android_config }}
        run: npm run tauri android build -- --apk --ci --target aarch64 armv7 --config "$ANDROID_CONFIG"

      - name: Rename Artifact
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::Build failed: no .apk found under src-tauri/gen/android/app/build/outputs/apk."
            exit 1
          fi
          cp "$apk" "${{ steps.tag.outputs.apk }}"
          echo "Created ${{ steps.tag.outputs.apk }}"

      # A file that exists is not an APK a phone will install, so it is asked directly rather
      # than inferred from the build having exited zero. Two things are checked because two
      # things have gone wrong for other projects: an unsigned APK is refused by Android
      # outright, and an APK with no native code for the phone holding it installs and then
      # fails to start. `apksigner` is the platform's own answer to the first, and its exit
      # status is what the step turns on; for the second this requires the slice that every
      # Android phone made this decade has and reports the rest, because the universal flavor is
      # what is supposed to carry all four and a list printed in the summary is how that gets
      # noticed rather than assumed.
      #
      # The signer is read off the CERTIFICATE rather than off one of apksigner's own labels,
      # and both its output and its silence are printed before either check: the label for a
      # signer's distinguished name is apksigner's wording and moves with its version, while
      # what has to be behind this file is the project's own `CN`, and a step that grepped for
      # the wording once failed on a file apksigner had already accepted. An unsigned release
      # build fails the first check; one that fell back to the debug key fails the second,
      # which is the difference between an APK that updates and one that does not.
      - name: Verify the APK
        run: |
          sdk="${ANDROID_SDK_ROOT}"
          build_tools="$(ls -1 "$sdk/build-tools" | sort -V | tail -1)"
          apksigner="$sdk/build-tools/$build_tools/apksigner"
          if [ ! -x "$apksigner" ]; then
            echo "::error::no apksigner at $apksigner."
            exit 1
          fi
          if ! "$apksigner" verify --print-certs "${{ steps.tag.outputs.apk }}" > apk-certs.txt 2>&1; then
            echo "::error::the APK is not signed, so Android will refuse to install it."
            cat apk-certs.txt
            exit 1
          fi
          echo "--- signer ---"
          cat apk-certs.txt
          if [ ! -s apk-certs.txt ]; then
            echo "::error::apksigner accepted the APK and named no signer, so there is nothing to read here."
            exit 1
          fi
          grep -q 'CN=Lithic' apk-certs.txt || {
            echo "::error::the APK is not signed by the project's release key, so it cannot update an installed copy."
            exit 1
          }
          # The character class carries the hyphen because the two slices that matter are the two
          # whose directories have one: `arm64-v8a` and `armeabi-v7a`. A class without it matches
          # `lib/x86/` and `lib/x86_64/` and nothing else, which is how an APK carrying all four
          # slices was reported as one carrying two.
          #
          # Both phone slices are required and an x86 one is a failure, which is the build's
          # ABI decision checked rather than assumed. `--target aarch64 armv7` is supposed to
          # leave the emulator pair out, and a step that only asked for arm64-v8a would pass a
          # build that had quietly gone back to carrying all four.
          abis=$(unzip -l "${{ steps.tag.outputs.apk }}" | grep -oE 'lib/[A-Za-z0-9_.-]+/' | sed 's|^lib/||; s|/$||' | sort -u)
          echo "--- native slices ---"
          echo "${abis:-none}"
          echo "${abis:-}" | grep -qx 'arm64-v8a' || {
            echo "::error::the APK carries no arm64-v8a slice, so it will not start on a modern phone."
            exit 1
          }
          echo "${abis:-}" | grep -qx 'armeabi-v7a' || {
            echo "::error::the APK carries no armeabi-v7a slice, so it will not install on a 32-bit phone."
            exit 1
          }
          if echo "${abis:-}" | grep -qE '^x86(_64)?$'; then
            echo "::error::the APK carries an emulator slice, which the build no longer asks for."
            exit 1
          fi

      # Sizes in the run summary, the same way every other job reports them: the APK carries
      # the launcher and the whole wiki, so a stray file in src/ shows up here as a jump
      # rather than as a surprise months later.
      - name: Report Artifact Sizes
        run: |
          echo "### Android artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "| artifact | size |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          mb=$(awk -v bytes="$(stat -c%s "${{ steps.tag.outputs.apk }}")" 'BEGIN { printf "%.2f", bytes / 1048576 }')
          echo "$mb MB  ${{ steps.tag.outputs.apk }}"
          echo "| ${{ steps.tag.outputs.apk }} | $mb MB |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "arm64-v8a and armeabi-v7a only, so an emulator cannot install this APK." >> "$GITHUB_STEP_SUMMARY"
          echo "Signed with the project's release key, so each build installs over the last one." >> "$GITHUB_STEP_SUMMARY"
          echo "The version code is minutes since the epoch, so every build orders after the one before it." >> "$GITHUB_STEP_SUMMARY"

      - name: Add to Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.date }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.tag.outputs.apk }}
