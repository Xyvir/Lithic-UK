name: Android Manual Release

# The phone build: one debug-signed, universal APK, added to the same release the wiki
# artifacts and the four desktop installers land on. Chained from publish-release.yml
# once the release exists, so a build's download page carries every platform a Lithic
# can be installed on.
#
# WHY THIS IS A WORKFLOW OF ITS OWN rather than a fifth job beside the four in
# `desktop-release.yaml`: those four are one subject (a machine that installs by putting a
# file somewhere) and this is another (a package a store or a phone's own installer
# places). The two also disagree about every tool they need. Keeping them apart means
# "Desktop Manual Release" keeps meaning that, and it means this job can be dispatched on
# its own while the platform is being brought up, which is the state it is in.
#
# WHY THE APK IS A DEBUG ONE, and it is the whole of the signing story rather than a first
# shot at it. Android refuses an unsigned APK outright and refuses an APK whose signature
# does not match the installed copy, so there are exactly two honest options: generate a
# keystore and keep it, or use the debug key that `--debug` brings with it. A generated
# keystore cannot live in the repository and nobody has put one in the secrets yet, and a
# key generated fresh on each run would be worse than none: every release would be
# uninstallable-over, with a "signatures do not match" the user has to work out for
# themselves. So this build is debug-signed on purpose, the name says so, and a
# release-signed APK (or an AAB for Play) is a follow-up that needs the two secrets and
# nothing else in here. What that costs today is a debug Rust profile, which is slower
# than a release one; what it buys is an artifact that installs, today, with no key
# anywhere.
#
# WHICH PHONES IT OPENS ON, and why two architectures rather than the four the template
# assumes. The APK is gradle's `universal` flavor, which packages every ABI it is handed:
# arm64-v8a and armeabi-v7a for phones, and x86 with x86_64 for the emulator, which is what
# an emulator runs and no phone sold this decade does. Measured on the one published APK
# (`Lithic_10.10.26-1817_debug.apk`, 632,262,452 bytes) by reading its zip directory rather
# than downloading it: 595.4 MB of the 603 MB is four `lib/<abi>/libapp_lib.so` files, each
# stored uncompressed (155.5 MB arm64-v8a, 156.8 MB x86_64, 146.1 MB x86, 137.1 MB
# armeabi-v7a), and everything else together (eight `classes*.dex`, `resources.arsc`, 884
# `res/` entries, `META-INF` and one `assets/tauri.conf.json`) is 7.3 MB, with the last
# ~0.2 MB the zip directory and the signing block. So the emulator pair was 302.9 MB of a
# download that no phone has ever installed. `--target aarch64 armv7` is what leaves it out:
# cargo-mobile2 turns that into `assembleUniversalDebug -PabiList=arm64-v8a,armeabi-v7a
# -ParchList=arm64,armv7 -PtargetList=aarch64,armv7`, and the verification step below fails
# the run if an `x86` slice comes back, so the saving is a fact about the artifact rather
# than an intention. What it costs is named rather than hidden: an emulator cannot install
# this APK, and the day one is wanted the flag loses its x86 half rather than the build
# growing a second flavor.
#
# WHAT THE DEBUG KEY ACTUALLY IS, because the paragraph above was reasoned from an
# assumption the published APK contradicts. `--debug` does not bring a debug key with it: it
# lets the Android Gradle plugin create one at `$HOME/.android/debug.keystore` the first
# time it needs it, and a CI runner has none. That APK's v2 signing block carries
# `CN=Android Debug, O=Android, C=US` with `notBefore Oct 10 19:24:55 2026 GMT`, ten seconds
# before its 19:25:05Z upload, so the key that signed it was made by that run. Android
# compares a new signature against the installed copy and refuses a mismatch, so the next
# APK installs over this one only after an uninstall, and that uninstall takes the app's
# stored state with it. Which is the outcome the paragraph above calls the worst of the
# three options, arriving by the route it says avoids it: a keystore in the repository's
# secrets is not only the way to a `release` profile, it is the way to an APK that updates
# in place.
#
# WHY THE GRADLE PROJECT IS NOT IN THE REPOSITORY: `tauri android init` writes
# `src-tauri/gen/android/`, and `src-tauri/gen/` is gitignored because everything in it is
# derived from `tauri.conf.json` and `capabilities/`, both of which are tracked. Running
# init here rather than committing its output keeps that rule whole and keeps the build
# reproducible from the sources. The cost is one init per run (seconds), and the follow-up
# if anyone wants Android Studio on the project is to commit the generated tree and
# delete this step.
#
# It only ever ADDS a file to a release that already exists, like every other job in this
# chain, so it cannot blank another platform's work.
#
# A HAND-RUN NAMES THE RELEASE IT ADDS TO, and the input is declared for the dispatch for the
# same reason it is declared for the chain: the tag is what the two half-hour jobs of this
# workflow are for, and the fallback below (today's date, when no tag is given) is a build that
# has nothing to add to and would mint a release of its own from the stamp. That is against the
# rule in the paragraph above, so the dispatch asks for the tag rather than letting a hand-run
# discover the difference on the release page. It is also what makes the note higher up true:
# this job can be dispatched on its own while the platform is being brought up, aimed at the
# release whose APK is missing.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to add the APK to, e.g. build-2026.10.10-1817'
        required: true
        type: string
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # Optional by design. Chained from publish-release.yml this artifact belongs to a
      # different run, so the download finds nothing; the committed src/lithic.html is then
      # the release's own bytes, because that is what the merged pull request carried.
      - name: Download Built Wiki Artifact
        if: ${{ inputs.tag_name != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: built-wiki
          path: src

      - name: Rename Downloaded Wiki
        if: ${{ inputs.tag_name != '' && hashFiles('src/lith.html') != '' }}
        run: mv src/lith.html src/lithic.html

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Gradle runs on a JVM and the Android Gradle plugin is fussy about which. 17 is what
      # Tauri's own Android template targets, and pinning it here is the same decision as
      # pinning the Linux jobs to 22.04: the toolchain that produces a release should not
      # change because a runner image was rolled forward.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache NPM dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'launcher-ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      # The two phone ABIs, named rather than left to `android build` to install for
      # itself: a target that is not installed is a build that fails rather than a download
      # that quietly carries fewer architectures than its name claims. The x86 pair is not
      # here on purpose, and the header has the measurement behind that choice.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      # The SDK is on the runner image; the NDK is what has to be found rather than
      # assumed. Both variables are exported because they answer different questions:
      # `ANDROID_HOME` is where the SDK is, which Gradle reads, and `NDK_HOME` is which
      # toolchain Tauri's CLI hands cargo, which is the cross-linker and the C compiler that
      # `rustls`' ring and the JNI glue are built with. A runner image that carries no NDK
      # gets the pinned one installed here, so this step cannot be the thing that makes the
      # job fail on a future image.
      - name: Set up the Android SDK and NDK
        run: |
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$sdk" ]; then
            echo "::error::no Android SDK at $sdk. This job needs a runner image that carries one."
            exit 1
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          ndk="$(ls -1 "$sdk/ndk" 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$ndk" ]; then
            echo "No NDK on the image; installing the pinned one."
            yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" > /dev/null
            ndk="27.0.12077973"
          fi
          if [ ! -d "$sdk/ndk/$ndk" ]; then
            echo "::error::$sdk/ndk/$ndk is not there after setup."
            exit 1
          fi
          echo "NDK_HOME=$sdk/ndk/$ndk" >> "$GITHUB_ENV"
          echo "Using NDK $ndk"

      - name: Install Dependencies
        run: |
          npm ci
          npm --prefix launcher-ui ci

      - name: Run Launcher UI Tests
        run: npm --prefix launcher-ui test

      - name: Build Launcher (Svelte Launcher Bundle)
        run: node scripts/build-launcher.mjs

      # Same rule as the desktop jobs: regenerate the icon set from the one source image, so
      # the launcher icon on the phone is the same drawing as the one in the taskbar. This has
      # to run before the patch step below, which is what actually puts the set into the Gradle
      # project: `android init` does NOT copy `src-tauri/icons/android/`, whatever an earlier
      # version of this comment claimed. Measured on the installed APK: the icon resources were
      # the template's, so the launcher icon was generic.
      - name: Generate Icons
        run: |
          if [ -f src/app-icon.png ]; then
            npm run tauri icon src/app-icon.png
          else
            echo "Icon file 'src/app-icon.png' not found, skipping icon generation."
          fi

      - name: Generate Date-Based Tag
        id: tag
        run: |
          tag="${{ inputs.tag_name }}"
          if [ -z "$tag" ]; then
            tag="v$(date +'%Y.%m.%d-%H%M')"
          fi
          echo "date=$tag" >> "$GITHUB_OUTPUT"
          # The same stamp rule as the exe and the four downloads beside it
          # (MM.DD.YY-HHMM), so one release's files still read as one set rather than as a
          # fifth naming scheme. `_debug` is part of the name and not a detail: the name is
          # the only thing a person sees before downloading, and it is the difference
          # between an APK that sideloads over the last one and an artifact somebody will
          # try to update from a store build it has no signature in common with. Anything
          # unparseable falls back to the whole tag, so a build never fails here.
          if [[ "$tag" =~ ([0-9]{4})\.([0-9]{2})\.([0-9]{2})-([0-9]{4}) ]]; then
            apk="Lithic_${BASH_REMATCH[2]}.${BASH_REMATCH[3]}.${BASH_REMATCH[1]:2:2}-${BASH_REMATCH[4]}_debug.apk"
          else
            apk="Lithic_${tag}_debug.apk"
          fi
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          # Semver for the APK's versionName, patched through TAURI_CONFIG the way the
          # desktop jobs patch the exe's file version, with leading zeros stripped and the
          # config's version as the fallback. Not cosmetic on Android: a leading zero is
          # rejected outright, so an unpadded stamp is the difference between an APK and a
          # Gradle failure.
          if [[ "$tag" =~ ([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            ver="${BASH_REMATCH[1]}.$((10#${BASH_REMATCH[2]})).$((10#${BASH_REMATCH[3]}))"
          else
            ver="0.2.0"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tauri_config={\"version\":\"$ver\"}" >> "$GITHUB_OUTPUT"

      # Generated here rather than committed (see the header). `--ci` is what stops it asking
      # whether to overwrite anything.
      - name: Initialize the Android Project
        run: npm run tauri android init -- --ci

      # The project init has just written is Tauri's template, and this is where the two things
      # wrong with it are put right: the placeholder launcher icon, and an activity that draws
      # the page under the system bars with nothing reserving their space. The order is the
      # point rather than a detail: init rewrites that tree on every run, so the patch has to
      # come after it and before the build. `scripts/patch-android.mjs` verifies each thing it
      # wrote and exits non-zero with a specific message when it cannot, because the failure
      # mode here is an APK that installs and simply looks wrong.
      - name: Patch the Generated Android Project
        run: node scripts/patch-android.mjs

      # `--apk` and not `--aab`: an AAB is a Play upload, not something a person can install,
      # and there is no Play listing to upload to yet. No `--split-per-abi` either, because
      # one download that opens on whichever phone fetched it is the whole point of a
      # universal build; that flag is for the day the size matters more than the confusion.
      # `--target aarch64 armv7` is the other half of that choice: the universal flavor
      # packages every ABI it is handed, and handing it the two phone architectures is what
      # keeps the emulator pair out of a phone's download (see the header for the numbers).
      - name: Build the APK
        env:
          TAURI_CONFIG: ${{ steps.tag.outputs.tauri_config }}
          # Baked in for the same reason the desktop jobs bake it: the launcher compares it
          # against the newest release and offers the download page when they differ. A build
          # without it offers nothing.
          LITHIC_BUILD_TAG: ${{ steps.tag.outputs.date }}
          # WHY THE DEBUG PROFILE IS TUNED FROM HERE RATHER THAN IN CARGO.TOML.
          #
          # `--debug` is what makes this APK installable at all: Android refuses an unsigned
          # package, no keystore is in the secrets, and the debug key is the one thing this
          # build can be signed with today. What arrives with it is cargo's `dev` profile,
          # which is the wrong profile for a file a person downloads: full debug info, no
          # optimisation, no dead-code elimination, and all of it inside each ABI's own
          # library, because an ELF keeps its DWARF in the shared object rather than
          # beside it the way a Windows build keeps a PDB.
          #
          # Measured on this crate's desktop build, same source, before and after the three
          # settings below: the executable 24 MB to 13 MB, its debug information 162 MB to
          # 9 MB, and the library target's own debug information 317 MB to 3 MB. For scale,
          # the whole program in `release`, with the LTO and strip `Cargo.toml` already asks
          # for, is 14 MB. The APK pays that difference once per ABI it carries, and that is
          # where most of its size comes from: the published four-ABI APK was 603 MB of
          # which 595.4 MB was these libraries, so this line is the whole of the story.
          #
          # An environment override rather than a `[profile.dev]` table, because that profile
          # is also how the developer and the local gate iterate: `cargo check`, clippy and the
          # test run all use it, and none of them should pay for an optimisation pass or lose
          # the symbols a failing test's backtrace is read from. This is the one place the
          # profile is built for a download, so this is the one place it is tuned.
          #
          # `debug = 0` is the whole of the size story, since the debug information is the
          # bulk and nobody steps through a build they downloaded. The other two make what is
          # left smaller rather than faster. No LTO: that would be paid for on each ABI of a
          # job that is already long, for a fraction of what the first line saves.
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_DEV_OPT_LEVEL: 's'
          CARGO_PROFILE_DEV_STRIP: 'symbols'
        run: npm run tauri android build -- --debug --apk --ci --target aarch64 armv7

      - name: Rename Artifact
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::Build failed: no .apk found under src-tauri/gen/android/app/build/outputs/apk."
            exit 1
          fi
          cp "$apk" "${{ steps.tag.outputs.apk }}"
          echo "Created ${{ steps.tag.outputs.apk }}"

      # A file that exists is not an APK a phone will install, so it is asked directly rather
      # than inferred from the build having exited zero. Two things are checked because two
      # things have gone wrong for other projects: an unsigned APK is refused by Android
      # outright, and an APK with no native code for the phone holding it installs and then
      # fails to start. `apksigner` is the platform's own answer to the first, and its exit
      # status is what the step turns on; for the second this requires the slice that every
      # Android phone made this decade has and reports the rest, because the universal flavor is
      # what is supposed to carry all four and a list printed in the summary is how that gets
      # noticed rather than assumed.
      #
      # The signer is read off the CERTIFICATE rather than off one of apksigner's own labels,
      # and both its output and its silence are printed before either check: the label for a
      # signer's distinguished name is apksigner's wording and moves with its version, while
      # what has to be behind a file called `_debug.apk` is the debug key's own `CN`, and a step
      # that grepped for the wording once failed on a file apksigner had already accepted.
      - name: Verify the APK
        run: |
          sdk="${ANDROID_SDK_ROOT}"
          build_tools="$(ls -1 "$sdk/build-tools" | sort -V | tail -1)"
          apksigner="$sdk/build-tools/$build_tools/apksigner"
          if [ ! -x "$apksigner" ]; then
            echo "::error::no apksigner at $apksigner."
            exit 1
          fi
          if ! "$apksigner" verify --print-certs "${{ steps.tag.outputs.apk }}" > apk-certs.txt 2>&1; then
            echo "::error::the APK is not signed, so Android will refuse to install it."
            cat apk-certs.txt
            exit 1
          fi
          echo "--- signer ---"
          cat apk-certs.txt
          if [ ! -s apk-certs.txt ]; then
            echo "::error::apksigner accepted the APK and named no signer, so there is nothing to read here."
            exit 1
          fi
          grep -qi 'android debug' apk-certs.txt || {
            echo "::error::the APK is not signed by the debug key, so the name it is published under is not true of it."
            exit 1
          }
          # The character class carries the hyphen because the two slices that matter are the two
          # whose directories have one: `arm64-v8a` and `armeabi-v7a`. A class without it matches
          # `lib/x86/` and `lib/x86_64/` and nothing else, which is how an APK carrying all four
          # slices was reported as one carrying two.
          #
          # Both phone slices are required and an x86 one is a failure, which is the build's
          # ABI decision checked rather than assumed. `--target aarch64 armv7` is supposed to
          # leave the emulator pair out, and a step that only asked for arm64-v8a would pass a
          # build that had quietly gone back to carrying all four.
          abis=$(unzip -l "${{ steps.tag.outputs.apk }}" | grep -oE 'lib/[A-Za-z0-9_.-]+/' | sed 's|^lib/||; s|/$||' | sort -u)
          echo "--- native slices ---"
          echo "${abis:-none}"
          echo "${abis:-}" | grep -qx 'arm64-v8a' || {
            echo "::error::the APK carries no arm64-v8a slice, so it will not start on a modern phone."
            exit 1
          }
          echo "${abis:-}" | grep -qx 'armeabi-v7a' || {
            echo "::error::the APK carries no armeabi-v7a slice, so it will not install on a 32-bit phone."
            exit 1
          }
          if echo "${abis:-}" | grep -qE '^x86(_64)?$'; then
            echo "::error::the APK carries an emulator slice, which the build no longer asks for."
            exit 1
          fi

      # Sizes in the run summary, the same way every other job reports them: the APK carries
      # the launcher and the whole wiki, so a stray file in src/ shows up here as a jump
      # rather than as a surprise months later.
      - name: Report Artifact Sizes
        run: |
          echo "### Android artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "| artifact | size |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          mb=$(awk -v bytes="$(stat -c%s "${{ steps.tag.outputs.apk }}")" 'BEGIN { printf "%.2f", bytes / 1048576 }')
          echo "$mb MB  ${{ steps.tag.outputs.apk }}"
          echo "| ${{ steps.tag.outputs.apk }} | $mb MB |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "arm64-v8a and armeabi-v7a only, so an emulator cannot install this APK." >> "$GITHUB_STEP_SUMMARY"
          echo "Debug-signed, so it sideloads and cannot be updated by a store build." >> "$GITHUB_STEP_SUMMARY"
          echo "The debug key is made per run, so installing over the last APK needs an uninstall first." >> "$GITHUB_STEP_SUMMARY"

      - name: Add to Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.date }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.tag.outputs.apk }}
