name: Rust Check

# Fast compile gate for the Tauri shell. The manual release workflow was the
# only place a full build happened, so Rust errors could sit on main until a
# release attempt. Both recent build failures (E0716 borrow error, E0277
# &str/str comparison) are rustc type/borrow errors that `cargo check` catches
# without linking — no bundling, no codesigning, just the compiler.
#
# Intentionally NOT included: `cargo fmt --check` and `cargo clippy
# -D warnings`. The tree is hand-formatted and clippy-clean enough to build;
# adopting them is a one-time sweep plus local-setup change, not a push gate.
on:
  push:
    branches:
      - main
    paths:
      - 'src-tauri/**'
      # `shared/sync_core.rs` is compiled through the crate (a `#[path]` module, not a package
      # of its own), so a push that edits only it changes what this job compiles.
      - 'shared/**'
      - 'scripts/check-android-face.mjs'
      - '.github/workflows/rust-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Tauri 2 needs webkit2gtk-4.1 (soup3), which 24.04 carries — the pin to
    # 22.04 existed only because v1 wanted the 4.0 headers Ubuntu 24.04 dropped.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The android-face step is a Node script, like the repository's other gates. Node is
      # already on the runner; naming the version keeps this job's answer the same one the
      # build workflow and a developer's machine give.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      # Type/borrow-check the crate without linking. System deps for tauri v2
      # on Linux (webkit2gtk 4.1 etc.) are needed to compile the glib/gtk FFI
      # bindings that cargo check must expand, plus git2's `https` transport, which is WinHTTP on Windows but OpenSSL here.
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets 2>&1 | tail -40 && exit ${PIPESTATUS[0]}

      # The GitHub-sync tests in main.rs. `cargo check --all-targets` only
      # type-checks them and the release workflow never runs cargo at all, so
      # without this step they only execute on a machine running the local
      # push gate. Linking the test binary needs the system deps above, hence
      # running after the cheap type gate rather than before it.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --quiet 2>&1 | tail -40 && exit ${PIPESTATUS[0]}

      # The phone's git face. Android is the only platform where `gitcore` means
      # `gitcore_unsupported` rather than the libgit2 module beside it, and nothing a
      # developer runs resolves a single `gitcore::` reference against the stub — which is
      # how the surface drifted once already: the sync contract's constants moved,
      # gitcore.rs followed them, the stub did not, and the Android release job was the
      # first thing to notice. This step compiles the crate with that predicate forced true
      # in a throwaway copy, so the phone's arrangement is checked on every push, with no
      # Android SDK and no NDK in sight.
      - name: android face (git stub)
        run: node scripts/check-android-face.mjs
