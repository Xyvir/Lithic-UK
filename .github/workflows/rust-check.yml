name: Rust Check

# Fast compile gate for the Tauri shell. The manual release workflow was the
# only place a full build happened, so Rust errors could sit on main until a
# release attempt. Both recent build failures (E0716 borrow error, E0277
# &str/str comparison) are rustc type/borrow errors that `cargo check` catches
# without linking — no bundling, no codesigning, just the compiler.
#
# Intentionally NOT included: `cargo fmt --check` and `cargo clippy
# -D warnings`. The tree is hand-formatted and clippy-clean enough to build;
# adopting them is a one-time sweep plus local-setup change, not a push gate.
on:
  push:
    branches:
      - main
    paths:
      - 'src-tauri/**'
      - '.github/workflows/rust-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Pinned: tauri v1 needs webkit2gtk-4.0 (soup2), which Ubuntu 24.04
    # dropped. The release workflow compiles on windows; this is type-check
    # only, and 22.04 carries the right system headers.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      # Type/borrow-check the crate without linking. System deps for tauri v1
      # on Linux (webkit2gtk etc.) are needed to compile the glib/gtk FFI
      # bindings that cargo check must expand.
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets 2>&1 | tail -40 && exit ${PIPESTATUS[0]}
