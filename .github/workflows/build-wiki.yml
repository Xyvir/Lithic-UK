name: Build and Release TiddlyWiki
run-name: Build ${{ (github.event_name == 'push' || inputs.create_release == true) && '(Release)' || '(Dry Run)' }}

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a Release'
        required: true
        type: boolean
        default: false
      build_config:
        description: 'Build Configuration'
        required: true
        default: 'prod'
        type: choice
        options:
        - prod
        - pre
        - dev
        - all
        - light

  # A push to main is a RELEASE CANDIDATE. The local gates (scripts/pre-push-check.mjs,
  # the Puppeteer smoke, cargo, svelte-check) run before anything lands, so what reaches
  # main is what should be built; nobody has to remember to dispatch this by hand
  # afterwards. What gets built is then STAGED ON A BRANCH AND REVIEWED rather than
  # pushed: the last job here opens a pull request carrying the artifacts and the launcher
  # UI gallery, and .github/workflows/publish-release.yml tags, publishes and chains the
  # desktop and server builds when that pull request is merged. Dispatch is still how you
  # get the other configs (pre/dev/all/light) and a dry run, and those still commit
  # straight to main, because a variant build is not a release.
  #
  # The filter is a BLACKLIST, deliberately: everything that lands on main is
  # load-bearing for at least one artifact (the wiki, the launcher, the desktop
  # app, the server image), so a new directory of shipping code is picked up
  # without anyone remembering to come back here. What is out:
  #
  #   * the files THIS RUN WRITES (see "Stage the release on a branch" below).
  #     A run whose own commit triggers another run never ends, so every path
  #     the release commits is excluded here by name.
  #   * docs, the licence and CI config: nothing in them reaches an artifact.
  #     That is also why editing this file does not run it — dispatch it.
  #   * the local-only harness (the push gate, the gallery, the Puppeteer smoke,
  #     the offline/artifact checks, the self-host stub): no build step runs
  #     them, and none of them ships.
  push:
    branches:
      - main
    paths:
      - '**'
      - '!src/lithic.html'
      - '!src/launcher.html'
      - '!variants/**'
      - '!manifest.json'
      - '!offline-service-worker.js'
      - '!*.md'
      - '!**/*.md'
      - '!LICENSE'
      - '!.github/**'
      - '!scripts/pre-push-check.mjs'
      - '!scripts/ui-gallery.mjs'
      - '!scripts/self-host-stub.mjs'
      - '!scripts/vault-copy.mjs'
      - '!scripts/test-*'
      - '!scripts/_*'
      - '!scripts/check-launcher-*.mjs'
      - '!scripts/check-light-artifact.mjs'

permissions:
  contents: write
  packages: write

# What this run IS. A push is always a prod release, a dispatch builds exactly
# what was asked for. Resolved once here because a push carries no inputs, so
# every prod/release gate below reads these two rather than branching on the
# event at each of the twenty-odd steps that care.
env:
  BUILD_CONFIG: ${{ github.event_name == 'push' && 'prod' || inputs.build_config }}
  CREATE_RELEASE: ${{ github.event_name == 'push' || inputs.create_release }}

# One writer to main at a time, repo-wide: concurrency groups are shared across
# workflows, and bump-pwa-version.yml deliberately names this same group.
# cancel-in-progress stays OFF — by the time this job reaches its push it has
# already built, and cancelling it is how you lose a finished release to nothing.
# A push release makes that matter more: three pushes in a row queue three runs
# rather than one being cancelled, and each is rebuilt from its own commit.
# A group only serializes workflows against each other; a person pushing while
# this runs is covered by scripts/ci-push-main.sh.
concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # Read by the jobs below: the branch the release was staged on and the stamp that
      # names it. A job's `if` may use only github/needs/vars/inputs, so the plan has to
      # travel here rather than be worked out again in each job that needs it.
      branch: ${{ steps.stage.outputs.branch }}
      stamp: ${{ steps.stage.outputs.stamp }}
      config: ${{ env.BUILD_CONFIG }}
      release: ${{ env.CREATE_RELEASE }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            launcher-ui/package-lock.json

      - name: Audit Hardcoded Colors
        run: node scripts/check-colors.js

      - name: Install Dependencies
        run: npm ci

      - name: Mirror External Plugins
        run: npm run mirror

      - name: Flatten Plugins
        run: node scripts/flatten-plugins.js

      - name: Generate All Plugin Info
        if: env.BUILD_CONFIG == 'all'
        run: node scripts/generate-all-info.js

      - name: Generate Build Config
        run: node scripts/generate-config.js $BUILD_CONFIG

      - name: Build Launcher (Svelte)
        if: env.BUILD_CONFIG == 'prod'
        run: npm run build:launcher

      - name: Verify Launcher Artifact (prod only)
        if: env.BUILD_CONFIG == 'prod'
        run: npm run test:launcher

      - name: Build TiddlyWiki (uglified for prod and light, plain otherwise)
        env:
          TIDDLYWIKI_PLUGIN_PATH: '${{ github.workspace }}/wiki:${{ github.workspace }}/wiki/plugins'
          TIDDLYWIKI_THEME_PATH: '${{ github.workspace }}/wiki/themes'
        run: |
          if [ "$BUILD_CONFIG" = "prod" ]; then
            set -o pipefail && npx tiddlywiki wiki --uglify --build index 2>&1 | tee wiki/tiddlywiki.log
          elif [ "$BUILD_CONFIG" = "light" ]; then
            # A published artifact like prod, so it is uglified too; it renders
            # through its own target so it cannot clobber the full build's output.
            set -o pipefail && npx tiddlywiki wiki --uglify --build light 2>&1 | tee wiki/tiddlywiki.log
          else
            set -o pipefail && npx tiddlywiki wiki --build index 2>&1 | tee wiki/tiddlywiki.log
          fi

      - name: Verify Uglified Artifact (prod only)
        if: ${{ env.BUILD_CONFIG == 'prod' }}
        run: |
          # The uglify pass must actually engage: artifact should shrink
          # materially versus an uncompressed build (typically ~30%).
          SIZE=$(stat -c%s wiki/output/index.html)
          echo "Uglified artifact size: $SIZE bytes"
          if [ "$SIZE" -gt 9500000 ]; then
            echo "::error::Artifact did not shrink as expected ($SIZE bytes) — the uglify pass may have silently failed. Check wiki/tiddlywiki.log"
            exit 1
          fi
          # The uglify toolchain must not ship inside the artifact (mirrors
          # the wizard's 'purge uglify-related tiddlers' option).
          if grep -q '"title":"\$:/plugins/flibbles/uglify"' wiki/output/index.html; then
            echo "::error::flibbles/uglify plugin leaked into the published artifact — the lithic-save save/all override is not being applied."
            exit 1
          fi
          # The WIKITEXT uglifier must stay OFF ($:/config/flibbles/uglify/text/vnd.tiddlywiki
          # = 'no'): it collapses load-bearing whitespace between SVG attributes and
          # after macro params, which mangles every $:/core/images/* SVG (context menus
          # render empty) and shifts the caret-pos offsets of the slashcommand tiddlers.
          # Both patterns below are unambiguous fingerprints of that pass.
          WIKITEXT_DAMAGE=$(grep -o -F -e 'size>>height=' -e '\parameters(size:' wiki/output/index.html | wc -l | tr -d ' ')
          if [ "$WIKITEXT_DAMAGE" -ne 0 ]; then
            echo "::error::wikitext uglifier damaged $WIKITEXT_DAMAGE tiddler sites (collapsed attribute/macro whitespace) - \$:/config/flibbles/uglify/text/vnd.tiddlywiki must be 'no'. See agents.md."
            exit 1
          fi

      - name: Rename Output
        if: ${{ env.BUILD_CONFIG != 'light' }}
        run: mv wiki/output/index.html wiki/output/lith.html

      - name: Brand Output
        if: ${{ env.BUILD_CONFIG != 'light' }}
        run: |
          sed -i 's/content="TiddlyWiki"/content="Lithic PKMS"/g' wiki/output/lith.html

      # The light artifact is the flash-sized distribution (lithic-light-tw.info),
      # built the same way and shipped alongside the full one so the two can never
      # drift apart. Built after the full build so the full build's own output is
      # already on disk; the light target writes its own filename.
      - name: Build Lithic Light (alongside prod)
        if: env.BUILD_CONFIG == 'prod'
        env:
          TIDDLYWIKI_PLUGIN_PATH: '${{ github.workspace }}/wiki:${{ github.workspace }}/wiki/plugins'
          TIDDLYWIKI_THEME_PATH: '${{ github.workspace }}/wiki/themes'
        run: |
          node scripts/generate-config.js light
          set -o pipefail && npx tiddlywiki wiki --uglify --build light 2>&1 | tee wiki/tiddlywiki.log

      - name: Verify Lithic Light Artifact
        if: ${{ env.BUILD_CONFIG == 'prod' || env.BUILD_CONFIG == 'light' }}
        run: |
          OUT=wiki/output/lithic-light.html
          if [ ! -f "$OUT" ]; then
            echo "::error::Lithic Light was not built ($OUT missing)"
            exit 1
          fi
          sed -i 's/content="TiddlyWiki"/content="Lithic PKMS"/g' "$OUT"
          SIZE=$(stat -c%s "$OUT")
          gzip -9 -c "$OUT" > "$OUT.gz"
          GZ=$(stat -c%s "$OUT.gz")
          echo "Lithic Light: $SIZE bytes raw / $GZ bytes gzipped"

          fail() { echo "::error::$1"; exit 1; }

          # The whole point of this artifact is that it fits a small host's flash
          # with room left for the wiki files beside it. Gzipped is the number that
          # matters (an ESP32 web server can serve it with Content-Encoding: gzip),
          # so that is the budget enforced; the raw ceiling is a drift alarm.
          [ "$SIZE" -lt 4000000 ] || fail "light artifact is $SIZE bytes — past the 4 MB drift ceiling. Check lithic-light-tw.info for what got pulled in."
          [ "$GZ" -lt 1048576 ] || fail "light artifact gzips to $GZ bytes — over the 1 MB flash budget."

          # Same two guarantees as the full artifact: the uglify toolchain must be
          # purged (lithic-save's save/all override), and the wikitext uglifier must
          # stay off (lithic-default-configs) or it collapses SVG/macro whitespace.
          grep -q '"title":"\$:/plugins/flibbles/uglify"' "$OUT" && fail "flibbles/uglify leaked into the light artifact — include xyvir/lithic-save in lithic-light-tw.info."
          WIKITEXT_DAMAGE=$(grep -o -F -e 'size>>height=' -e '\parameters(size:' "$OUT" | wc -l | tr -d ' ')
          [ "$WIKITEXT_DAMAGE" -eq 0 ] || fail "wikitext uglifier damaged $WIKITEXT_DAMAGE tiddler sites — \$:/config/flibbles/uglify/text/vnd.tiddlywiki must be 'no' (xyvir/lithic-default-configs)."

          # Saving from a browser carries editor state along; a build must not.
          JUNK=$(grep -o -e '"title":"\$:/temp/' -e '"title":"\$:/state/popup/' "$OUT" | wc -l | tr -d ' ')
          [ "$JUNK" -eq 0 ] || fail "light artifact carries $JUNK editor-state tiddlers — it was not rendered through the publish override."
          exit 0

      # A prod release does not push itself to main any more. It stages the same commit on
      # a branch and the open-pr job below opens a pull request for it, so the wiki
      # artifact, the variants, the PWA bump and the launcher are all reviewed before they
      # land, with the launcher UI gallery in the description. Merging that pull request is
      # what publishes; closing it publishes nothing and needs nothing undone, because no
      # tag and no release exist yet to clean up.
      #
      # The branch is keyed to the build stamp, which is also the tag: the review, the
      # release and the desktop downloads of one build all carry the same name, so a
      # download is traceable back to the run that produced it.
      - name: Stage the release on a branch (prod release)
        id: stage
        if: ${{ env.CREATE_RELEASE == 'true' && env.BUILD_CONFIG == 'prod' }}
        run: |
          STAMP=$(date +'%Y.%m.%d-%H%M')
          BRANCH="release/$STAMP"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH"
          mkdir -p variants
          cp wiki/output/lith.html variants/prod.html
          cp wiki/output/lith.html src/lithic.html
          cp wiki/output/lithic-light.html variants/lithic-light.html
          
          # Bump PWA version to clear service worker cache
          CURRENT_VERSION=$(grep '"version":' manifest.json | sed -E 's/.*"version": "([^"]+)".*/\1/')
          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
          NEW_VERSION="$major.$minor.$((patch + 1))"
          
          sed -i "s/\"version\": \"$CURRENT_VERSION\"/\"version\": \"$NEW_VERSION\"/" manifest.json
          sed -i "s/const VERSION = '[^']*'; \/\/ Updated by build pipeline/const VERSION = '$NEW_VERSION'; \/\/ Updated by build pipeline/" offline-service-worker.js

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add variants/prod.html variants/lithic-light.html src/lithic.html src/launcher.html manifest.json offline-service-worker.js
          git diff --cached --quiet || git commit -m "Release build-$STAMP: src/lithic.html + variants/prod.html, and bump PWA to $NEW_VERSION"
          # A branch push cannot lose a race with a main that moved, which is the failure
          # scripts/ci-push-main.sh was written to survive on the push path. That script is
          # still what the non-prod variant commits below use.
          git push --set-upstream origin "$BRANCH"

      - name: Commit Built Wiki to variants (non-prod)
        if: ${{ env.BUILD_CONFIG != 'prod' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$BUILD_CONFIG" = "light" ]; then
            # The light distribution publishes to variants/, beside the other
            # distributions. It must not sit in src/: that directory is the
            # desktop app's frontendDist, so a file there is embedded in the
            # executable, and nothing loads a light build at runtime.
            mkdir -p variants
            cp wiki/output/lithic-light.html variants/lithic-light.html
            git add variants/lithic-light.html
            git diff --cached --quiet || git commit -m "Update variants/lithic-light.html from build"
          else
            mkdir -p variants
            cp wiki/output/lith.html variants/$BUILD_CONFIG.html
            git add variants/$BUILD_CONFIG.html
            git diff --cached --quiet || git commit -m "Update variants/$BUILD_CONFIG.html from build"
          fi
          bash scripts/ci-push-main.sh

      - name: Archive Wiki Folder
        run: zip -r wiki.zip wiki

      # The tag, the GitHub Release and the desktop/server chains used to be here. They
      # moved to publish-release.yml, which runs when the staged pull request is merged: a
      # build nobody approved must not have a tag, a download page, a container image or
      # four desktop installers attached to it. The wiki artifact is still uploaded, both
      # because the chained workflows look for it and because it is the cheapest way to
      # look at what a wrong build actually produced.
      - name: Upload Built Wiki Artifact
        if: ${{ env.CREATE_RELEASE == 'true' && env.BUILD_CONFIG == 'prod' }}
        uses: actions/upload-artifact@v5
        with:
          name: built-wiki
          path: wiki/output/lith.html
          retention-days: 1

      # Where the GitHub Release used to be created. It is now created on merge, in
      # publish-release.yml, with the same asset list and the same rule: one asset per
      # artifact, the flagship taken from src/lithic.html so the download is the bytes the
      # app embeds, and the two derived assets (the gzipped light build and wiki.zip)
      # rebuilt there from the tree the merge landed.

      - name: Upload Build Artifacts (Dry Run)
        if: ${{ env.CREATE_RELEASE == 'false' }}
        uses: actions/upload-artifact@v5
        with:
          name: build-artifacts-dry-run
          path: |
            wiki/output/lith.html
            wiki/output/lithic-light.html
            wiki/output/lithic-light.html.gz

      - name: Upload Built Launcher (prod only)
        if: env.BUILD_CONFIG == 'prod'
        uses: actions/upload-artifact@v5
        with:
          name: launcher-html
          path: src/launcher.html
          retention-days: 14

      - name: Upload Debug Logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: debug-logs
          path: |
            wiki/mirror.log
            wiki/flatten-manifest.log
            wiki/tiddlywiki.log

  # The launcher UI gallery, as the review material for the pull request below.
  #
  # This is the only place the deck runs outside a developer's machine, and it needs four
  # things the build job's own environment does not have: Node 24 (the deck reads
  # `launcher-ui/src/color-palette.ts` directly, which is type stripping, and the launcher
  # build itself is pinned to 24 for the same reason), a Chrome for Puppeteer, ImageMagick 7
  # for the tiling (see scripts/install-imagemagick7.sh, which explains why the distro's
  # packages cannot supply the `magick` the deck invokes), and a text font, because montage
  # asks freetype for its label's metrics before it lays anything out and so needs one even
  # for a sheet with no names on it. This image has only an emoji face; the script adds
  # fonts-dejavu-core, and scripts/sheet-tile.mjs tiles without any text if it cannot.
  #
  # `continue-on-error` is the design rather than a softener. The deck is review material:
  # a pane that cannot reach its state fails `ui-gallery.mjs` on purpose, and that failure
  # must not stop a release from being reviewable at all. The pull request still opens and
  # its description says the pictures are missing, which is a worse description than one
  # carrying twelve sheets and a much better outcome than no pull request.
  #
  # It runs on any prod build and not only on a release, which is what makes the gallery
  # itself reviewable rather than only its release output: a dispatch with
  # `create_release: false` and the prod config shoots every sheet and publishes the
  # pictures as this run's own artifact. Without that, the one way to see a gallery change
  # was to mint a release candidate for it, because `.github/**` and the deck's own scripts
  # are all off the push trigger (see the path filter above) and so cannot start a run by
  # themselves. Only the branch publish and the pull request are release business, and they
  # stay behind `CREATE_RELEASE` where they belong.
  deck:
    needs: build
    if: needs.build.outputs.config == 'prod'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install repository dependencies
        run: npm ci

      - name: Install Puppeteer browser
        run: npx puppeteer browsers install chrome

      - name: Install ImageMagick 7
        run: bash scripts/install-imagemagick7.sh

      # The deck photographs the launcher this pull request proposes rather than one
      # rebuilt here: a sheet of a different build from the one under review would be worse
      # than no sheet at all. Where the file lands in the artifact is not assumed, since
      # upload-artifact stores a single file at the artifact's root and a directory keeps
      # its shape.
      - name: Take the built launcher
        uses: actions/download-artifact@v5
        with:
          name: launcher-html
          path: .launcher-artifact

      - name: Put it where the deck looks for it
        run: |
          FOUND=$(find .launcher-artifact -name launcher.html | head -1)
          [ -n "$FOUND" ] || { echo "::error::the launcher-html artifact carried no launcher.html"; exit 1; }
          cp "$FOUND" src/launcher.html
          ls -la src/launcher.html

      - name: Shoot the gallery
        run: node scripts/ui-gallery.mjs

      # The sheets go on a branch of their own, force-pushed as a single commit, and never
      # to main: `ui-gallery/` is gitignored precisely because 18 MB of PNGs does not
      # belong in the history of the branch under review. One commit per build rather than
      # an accumulating history keeps that branch the size of the newest deck. The stamp is
      # in the path because the raw host caches by URL, so a path that changes every build
      # is a URL that can never serve the previous build's sheet.
      # Only a release puts the sheets on the branch, because that branch exists to serve
      # the pull request's description. A dry run keeps them as the artifact below — and it
      # gets them even when the gallery failed, because the sheets drawn before the pane
      # that failed are still worth looking at (`always()`), as long as there are any.
      - name: Publish the sheets
        if: always() && env.CREATE_RELEASE == 'true'
        env:
          STAMP: ${{ needs.build.outputs.stamp }}
        run: |
          [ -n "$STAMP" ] || { echo "::error::no build stamp to publish sheets under"; exit 1; }
          if ! ls ui-gallery/sheet-*.png >/dev/null 2>&1; then
            echo "::warning::the gallery drew no sheet, so there is nothing to publish"
            exit 0
          fi
          mkdir -p "deck/$STAMP"
          cp ui-gallery/sheet-*.png "deck/$STAMP/"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ui-deck-staging
          # `read-tree --empty` rather than `git rm -r --cached .`, and the difference is
          # the step above: the deck overwrites `src/launcher.html` with the artifact it
          # photographed, so a tracked file differs from both the index and HEAD, and
          # `git rm --cached` refuses to unstage exactly that case ("staged content
          # different from both the file and the HEAD"). Emptying the index says the same
          # thing without asking about a working tree it leaves alone, and the commit below
          # still holds the deck and nothing else.
          git read-tree --empty
          git add -f "deck/$STAMP"
          git commit -m "Deck for build-$STAMP"
          git push --force origin HEAD:ui-deck

      # `always()` because this is the run's only record of what the deck did: a deck that
      # died at pane 40 has still drawn the sheets it got through, and the coverage report
      # is written either way. The sheets themselves are here too: a release publishes them
      # to the `ui-deck` branch for its pull request to embed, and a dry run has no branch
      # and no pull request, so this artifact is how its pictures are looked at.
      - name: Upload the deck report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: deck-report
          path: |-
            ui-gallery/sheets.json
            ui-gallery/modal-coverage.md
            ui-gallery/sheet-*.png
          retention-days: 3
          if-no-files-found: warn

  # The pull request that carries the release: the last thing a build does, and the point at
  # which a person decides whether any of it ships.
  #
  # It runs even when the deck failed, because the artifacts are worth reviewing without
  # pictures and a build that cannot open its own review cannot be approved at all.
  open-pr:
    needs: [build, deck]
    if: always() && needs.build.result == 'success' && needs.build.outputs.release == 'true' && needs.build.outputs.config == 'prod'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Take the deck's report
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: deck-report
          path: deck-report

      # The body is composed here rather than on the deck job, so that the same script
      # writes it whether or not the deck ran: handed no sheets.json it says so, and the
      # description is still an accurate account of the pull request.
      - name: Compose the description
        env:
          STAMP: ${{ needs.build.outputs.stamp }}
          # `deck/` belongs in the base because it is in the published path: the sheets go
          # to `deck/<stamp>/` on the `ui-deck` branch (see "Publish the sheets" above),
          # and the composer appends a sheet's file name to this, so a base one segment
          # short points every image at a 404 that only shows up as a broken picture.
          BASE: https://raw.githubusercontent.com/${{ github.repository }}/ui-deck/deck/${{ needs.build.outputs.stamp }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/gallery-pr-body.mjs \
            --sheets deck-report/sheets.json \
            --coverage deck-report/modal-coverage.md \
            --base "$BASE" \
            --run-url "$RUN_URL" \
            --stamp "$STAMP" \
            --out pr-body.md
          echo "--- body, $(wc -c < pr-body.md) bytes ---"
          head -20 pr-body.md

      # A pull request opened with the repository token does not start other workflows:
      # GitHub suppresses runs caused by that token so a bot cannot recurse. The review
      # therefore carries the diff and the sheets and not a set of checks, which is fine
      # here because nothing PR-triggered has anything to add to a build that just passed
      # its own gates. Merging is a person's action, so publish-release.yml does run.
      # The message is captured and re-said as an annotation rather than left on stderr,
      # because this is the one step a repository setting can refuse — Actions-created pull
      # requests are off by default on a repository whose settings were never touched — and
      # an annotation is readable by anybody who can see the run, where a log needs the
      # job's own output opened. It goes out as a single line, since a newline would end it.
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.build.outputs.branch }}
          STAMP: ${{ needs.build.outputs.stamp }}
        run: |
          [ -n "$BRANCH" ] || { echo "::error::the build staged no release branch"; exit 1; }
          if ! MESSAGE=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release build-$STAMP" \
            --body-file pr-body.md 2>&1); then
            echo "::error::opening the pull request failed: $(printf '%s' "$MESSAGE" | tr '\n' ' ' | cut -c1-600)"
            exit 1
          fi
          echo "$MESSAGE"