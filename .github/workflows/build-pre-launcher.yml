name: Build Modular Launcher (Preview)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pre-launcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install repository dependencies
        run: npm install

      - name: Build modular launcher
        run: npm run build:pre-launcher

      - name: Commit preview artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/pre-launcher.html
          git diff --cached --quiet || git commit -m "Build modular launcher preview"
          git push

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pre-launcher
          path: src/pre-launcher.html
          retention-days: 14
