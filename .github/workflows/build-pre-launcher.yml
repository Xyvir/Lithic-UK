name: Build Modular Launcher (Preview)

on:
  workflow_dispatch:
    inputs:
      virtual-headed:
        description: 'Run Puppeteer with a virtual headed display (Xvfb)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-pre-launcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install repository dependencies
        run: npm install

      - name: Test modular launcher logic
        run: npm test

      - name: Build modular launcher
        run: npm run build:pre-launcher

      - name: Install Puppeteer browser
        run: npx puppeteer browsers install chrome

      - name: Run Puppeteer launcher smoke test
        run: npm run test:puppeteer

      - name: Run virtual-headed Puppeteer smoke test
        if: ${{ inputs.virtual-headed == true }}
        run: xvfb-run -a npm run test:puppeteer:headed

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pre-launcher
          path: src/pre-launcher.html
          retention-days: 14
