name: Build Launcher (Preview)

on:
  workflow_dispatch:
    inputs:
      virtual-headed:
        description: 'Run Puppeteer with a virtual headed display (Xvfb)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-launcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            launcher-ui/package-lock.json

      - name: Install repository dependencies
        run: npm ci

      - name: Test launcher logic
        run: npm test

      - name: Build launcher
        run: npm run build:launcher

      - name: Install Puppeteer browser
        run: npx puppeteer browsers install chrome

      - name: Run Puppeteer launcher smoke test
        run: npm run test:puppeteer

      - name: Run virtual-headed Puppeteer smoke test
        if: ${{ inputs.virtual-headed == true }}
        run: xvfb-run -a npm run test:puppeteer:headed

      - name: Upload preview artifact
        uses: actions/upload-artifact@v5
        with:
          name: launcher
          path: |
            src/launcher.html
            src/lithic.html
          retention-days: 14
