name: Build Launcher (Preview)

on:
  workflow_dispatch:
    inputs:
      virtual-headed:
        description: 'Run Puppeteer with a virtual headed display (Xvfb)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# The smoke tests below drive Chrome and install it in the step that uses it, so the install
# would otherwise fetch the same browser twice: once as a side effect of `npm ci` and once on
# purpose. Nothing else in this workflow uses a browser.
env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  build-launcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout and set up Node
        uses: $/.github/actions/setup

      - name: Install repository dependencies
        run: npm ci

      - name: Test launcher logic
        run: npm test

      - name: Build launcher
        run: npm run build:launcher

      - name: Bump PWA Version
        run: |
          CURRENT_VERSION=$(grep '"version":' manifest.json | sed -E 's/.*"version": "([^"]+)".*/\1/')
          echo "Current Version: $CURRENT_VERSION"

          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
          NEW_PATCH=$((patch + 1))
          NEW_VERSION="$major.$minor.$NEW_PATCH"
          echo "New Version: $NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

          sed -i "s/\"version\": \"$CURRENT_VERSION\"/\"version\": \"$NEW_VERSION\"/" manifest.json
          sed -i "s/const VERSION = '[^']*'; \/\/ Updated by build pipeline/const VERSION = '$NEW_VERSION'; \/\/ Updated by build pipeline/" offline-service-worker.js

      - name: Commit and Push PWA Bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json offline-service-worker.js
          git diff --cached --quiet || (git commit -m "chore: bump PWA version to $NEW_VERSION [skip ci]" && bash scripts/ci-push-main.sh)

      # One definition for the browser a job drives, with a cache under it: see
      # `.github/actions/browser`. It has to come after `npm ci`, because the command it runs
      # is the repository's own puppeteer rather than one fetched from the registry.
      - name: Install Puppeteer browser
        uses: $/.github/actions/browser

      - name: Run Puppeteer launcher smoke test
        run: npm run test:puppeteer

      - name: Run virtual-headed Puppeteer smoke test
        if: ${{ inputs.virtual-headed == true }}
        run: xvfb-run -a npm run test:puppeteer:headed

      # The artifact ships to instances, to USB sticks and to file:// alike, so it has to
      # carry every byte it needs. This fails on a CDN reference, a font from somebody
      # else's host, or any bootstrap that reaches for the network.
      - name: Offline gate
        run: npm run check:offline

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: |
            src/launcher.html
            src/lithic.html
            manifest.json
            offline-service-worker.js
          retention-days: 14
