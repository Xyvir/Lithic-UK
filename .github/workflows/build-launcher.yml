name: Build Launcher (Preview)

on:
  workflow_dispatch:
    inputs:
      virtual-headed:
        description: 'Run Puppeteer with a virtual headed display (Xvfb)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-launcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            launcher-ui/package-lock.json

      - name: Install repository dependencies
        run: npm ci

      - name: Test launcher logic
        run: npm test

      - name: Build launcher
        # The published artifact is the asking one (`auto`): both prongs compiled in, and the
        # page asks the executable which one it has. Any other pin at this path is refused by
        # the build script itself (see scripts/build-launcher.mjs), so this names the default
        # on purpose rather than by omission.
        run: npm run build:launcher -- --sync=auto

      # The pin, proved against the artifacts it builds: `--sync=github` and `--sync=iroh` are
      # built into a scratch directory and each one is checked for the code it sheds (the wasm
      # glue for the first, the repository dialog for the second), plus the committed artifact
      # for carrying both. See scripts/check-sync-pin.mjs.
      - name: Verify sync pin
        run: npm run check:sync-pin

      - name: Install Puppeteer browser
        run: npx puppeteer browsers install chrome

      - name: Run Puppeteer launcher smoke test
        run: npm run test:puppeteer

      - name: Run virtual-headed Puppeteer smoke test
        if: ${{ inputs.virtual-headed == true }}
        run: xvfb-run -a npm run test:puppeteer:headed

      # The artifact ships to instances, to USB sticks and to file:// alike, so it has to
      # carry every byte it needs. This fails on a CDN reference, a font from somebody
      # else's host, or any bootstrap that reaches for the network.
      - name: Offline gate
        run: npm run check:offline

      - name: Upload preview artifact
        uses: actions/upload-artifact@v5
        with:
          name: launcher
          path: |
            src/launcher.html
            src/lithic.html
            # The device sync engine the launcher fetches at runtime. It sits beside
            # the launcher in every deployment, so the preview carries it too.
            src/launcher.wasm
          retention-days: 14
