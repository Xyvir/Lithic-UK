[package]
name = "lithic"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# The library target is what lets the same code run on Android and iOS: Tauri 2
# builds a mobile app from a shared library, and the desktop executable is a thin
# caller of `app_lib::run`. Nothing about desktop behaviour depends on it.
[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# A Start Menu entry on install, written through the shell's own IShellLink, and
# the update offer's hand-off to the system browser through ShellExecuteW (whose
# show-window argument lives in WindowsAndMessaging). Microsoft's bindings, and
# 0.61 is already in the tree via tauri, so this adds features to a build that
# already exists rather than a new dependency.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# The WebView2 handler that answers the page's own Basic-auth challenges
# (`webview_auth.rs`). 0.38 is the version tauri 2.11 already builds, so this
# names a crate that is in the graph regardless rather than adding one — and the
# `with_webview` handle tauri hands out is typed in this crate's interfaces, so
# there is nothing to wrap.
webview2-com = "0.38"

[dependencies]
# Tauri 2 has no `api-all`: each API moved into a plugin, and this app only ever
# used two of them — http (now plain reqwest, below) and the file dialog.
tauri = { version = "2", features = [] }
# The native open/save dialog, used from Rust only: the launcher never opens one
# from JavaScript, so no capability entry is needed for it.
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5"
# The credential vault. RustCrypto, pure Rust: no C, no OpenSSL, nothing to
# install, and it cross-compiles unchanged to the macOS, AppImage and mobile
# targets this app is headed for. `zeroize` was already in the tree via tauri.
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
base64 = "0.22"
# The vault's origin index: salted hashes of the origins it holds, so the launcher
# can colour a bookmark's key control without unlocking anything. Already in the
# tree at this version, so it costs a line rather than a download.
sha2 = "0.10"
# OsRng for the vault's salt and nonce. Already in the tree at this major.
getrandom = "0.2"

# Outbound HTTP and in-process git, and the one place where which crate answers a
# question is decided by the target rather than by the whole build.
#
# Android is why these are not in `[dependencies]`. Both of them reach for a TLS
# implementation a phone does not have, and a crate named in both `[dependencies]`
# and a target table is the *union* of the two entries rather than the target's own,
# so an Android entry up there would still drag OpenSSL into the build. Hence the
# desktop pair below and the phone's answer beside it.
[target.'cfg(not(target_os = "android"))'.dependencies]
# Outbound HTTP: the GitHub device flow and API, the instance manifest probe, and
# the instance icon fetch. `default-tls` is the platform stack (SChannel on
# Windows, OpenSSL elsewhere), which is what git2's `https` transport uses too, so
# the app ships one TLS implementation rather than two.
reqwest = { version = "0.12", features = ["json"] }
# In-process git for the GitHub sync. `https` maps to the platform TLS stack
# (WinHTTP on Windows, SecureTransport on macOS, OpenSSL elsewhere); the default
# features are empty, so it has to be requested explicitly. `vendored-libgit2`
# compiles the vendored C sources with the `cc` crate and links them statically —
# no cmake, no system libgit2, nothing for a user to install.
git2 = { version = "0.21.0", default-features = false, features = ["https", "vendored-libgit2"] }

# Android, and the build is smaller than the desktop one on purpose rather than for
# want of an implementation.
#
# No git: `git2`'s `https` feature asks for OpenSSL on every unix, so carrying the
# sync here would mean cross-compiling OpenSSL for each of the phone's four ABIs. What
# that sync *does* has no meaning on a phone anyway — there is no `Documents\Lithic` to
# keep a repository in, no folder picker that reaches one, and no exe to copy beside your
# liths — so the answer is the one the published PWA already gives: your wiki and your
# files, synced by whatever you point at them. `gitcore_unsupported` is where that is
# said to the rest of the crate.
#
# `rustls` rather than the platform stack, and it is the only TLS the Android build
# links: pure Rust, so there is nothing to cross-compile and nothing that has to find a
# system library on a phone.
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# The one thing a macOS build has to have that it does not use, and the only reason
# this table exists. `git2`'s `https` feature enables `openssl-sys` on every unix, and on
# Apple nothing links it: libgit2-sys's own build script gives libgit2 SecureTransport for
# its transport and CommonCrypto for its SHA-256 there, and only reaches for OpenSSL
# everywhere else. What is left is a build script that has to SUCCEED and a library nothing
# references — and the build script still has to find an OpenSSL, which is what a universal
# build cannot do: the arm64 slice finds Homebrew's copy on a developer's Mac and the Intel
# slice never does, and pointing both at Homebrew's would put a path from somebody's machine
# into a distributed app and a Homebrew dylib in its install names. `vendored` is the answer
# that asks nothing of the machine: `openssl-src` compiles OpenSSL for whichever slice is
# being built, statically, and because no symbol from it is referenced the linker drops it
# from the binary. Linux and Windows are untouched: this dependency is only in the graph for
# the macOS target, so the AppImage and the executable keep the system OpenSSL and WinHTTP
# they already link.

[target.'cfg(target_os = "macos")'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }

[profile.release]
# The executable carries its whole frontend (the launcher and the wiki, ~8 MB of
# HTML) and links a vendored libgit2, so the default profile — no LTO, sixteen
# codegen units, symbols kept — leaves real weight on the table.
#
# `lto` and one codegen unit let the linker drop the cross-crate duplicates that
# `codegen-units = 16` has to assume it cannot see; `strip` drops the symbol
# table (the Windows PDB is emitted separately and kept for crash triage rather
# than shipped). Measured against the 12.30 MB v1 binary this replaces: see the
# release notes for the v2 figure.
lto = true
codegen-units = 1
strip = true

# Argon2id is a memory-hard KDF and it is pure Rust, which means an unoptimised
# build runs it something like fifty times slower — and the vault's tests derive a
# key dozens of times, once per create, unlock and rotate. Sampling a realistic
# cost instead of paying an unrealistic one keeps `cargo test` (and so the gate)
# in seconds, and it changes nothing about what is tested: the same parameters,
# salt sizes and AEAD framing are exercised either way.
[profile.dev.package.argon2]
opt-level = 3
