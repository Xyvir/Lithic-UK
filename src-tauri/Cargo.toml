[package]
name = "lithic"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dependencies]
tauri = { version = "1", features = ["api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5"

[features]
custom-protocol = ["tauri/custom-protocol"]
